# docker compose up --build   (needs PROVIDER + its key in .env; http://127.0.0.1:8000)
# Local model: run Ollama on the host and set PROVIDER=ollama in .env (see README). There is no automatic fallback between providers.
services:
  app:
    build: .
    volumes:
      - ./idx:/app/idx:ro
      - ./data:/app/data
      - ./out:/app/out
      - ./runs:/app/runs:ro   # saved runs, for `tcb eval --rescore runs/<label>`
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      APP_HOST: 0.0.0.0
      INDEX_DIR: /app/idx
    extra_hosts:
      - "host.docker.internal:host-gateway"   # lets PROVIDER=ollama reach an Ollama running on the host
